:root{--blue:#0000DE;--wh:#fff;--dim:rgba(255,255,255,.65);--line:rgba(255,255,255,.3);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body,button,input{font-family:'ErrorF',monospace;font-synthesis:none}
body{background:var(--blue);color:var(--wh);min-height:100vh;-webkit-font-smoothing:none}
.bar{position:sticky;top:0;z-index:5;background:var(--wh);color:var(--blue);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,env(safe-area-inset-left));font-size:16px;letter-spacing:1px}
.bar button{font-size:13px;letter-spacing:2px;background:var(--blue);color:var(--wh);border:0;padding:8px 12px;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-left)) 80px}
h1{font-size:clamp(32px,6vw,64px);font-weight:400;line-height:1}
.sub{opacity:.7;margin-top:10px;font-size:16px}
/* login */
.login{max-width:420px;margin:12vh auto 0;padding:0 16px}
.login h1{margin-bottom:36px}
.f{display:block;margin-bottom:20px}
.f span{display:block;font-size:13px;letter-spacing:3px;opacity:.7;margin-bottom:8px}
.f input{width:100%;font-size:20px;color:var(--wh);background:transparent;border:0;border-bottom:2px solid var(--wh);padding:8px 0;outline:none;border-radius:0}
.f input:focus{background:rgba(255,255,255,.07)}
.btn{font-size:15px;letter-spacing:2px;padding:16px 18px;background:var(--wh);color:var(--blue);border:2px solid var(--wh);cursor:pointer}
.btn.ghost{background:transparent;color:var(--wh)}
.btn[aria-pressed=true]{background:var(--wh);color:var(--blue)}
.btn.ghost[aria-pressed=false]{opacity:.85}
.err{min-height:1.3em;margin-top:14px;font-size:15px}
/* panel */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:36px 0 28px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:28px}
.kpi{border:2px solid var(--wh);padding:16px}
.kpi small{display:block;font-size:12px;letter-spacing:2px;opacity:.7;margin-bottom:10px}
.kpi b{font-weight:400;font-size:clamp(34px,5vw,52px);font-variant-numeric:tabular-nums;line-height:1}
.bars{margin-bottom:30px}
.br{margin-bottom:14px}
.br .t{display:flex;justify-content:space-between;font-size:16px;letter-spacing:2px;margin-bottom:6px}
.track{height:22px;border:2px solid var(--wh);padding:3px}
.track i{display:block;height:100%;background:var(--wh);width:0;transition:width .5s steps(10)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools input{flex:1 1 240px;min-width:0;font-size:17px;color:var(--wh);background:transparent;border:2px solid var(--wh);padding:10px 12px;outline:none}
.tools input::placeholder{color:var(--wh);opacity:.4}
.tw{overflow-x:auto;border-top:2px solid var(--wh)}
table{width:100%;border-collapse:collapse;font-size:16px;min-width:620px}
th{font-weight:400;font-size:12px;letter-spacing:2px;opacity:.7;text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}
td{padding:11px 8px;border-bottom:1px dashed var(--line);vertical-align:top;word-break:break-word}
td.n{opacity:.55;width:44px}
.pill{font-size:12px;letter-spacing:1px;padding:2px 7px;border:1px solid var(--wh);white-space:nowrap}
.pill.c{background:var(--wh);color:var(--blue)}
.empty td{opacity:.6;text-align:center;padding:30px}
.foot{opacity:.6;font-size:13px;margin-top:14px;letter-spacing:1px}
button:focus-visible,input:focus-visible{outline:2px dashed var(--wh);outline-offset:3px}
</style>
</head>

<script>
const SUPABASE_URL='https://rpwlweyjidvxxvaeigkw.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwd2x3ZXlqaWR2eHh2YWVpZ2t3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzNjc4NzgsImV4cCI6MjEwOTk0Mzg3OH0.u6XfuUuhI5aMqmukQ9zEkA7WQ9YdeDISGBDGwj4Y4i8';
const $=id=>document.getElementById(id);
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let votes=[],donas=[],timer=null;
const fmt=s=>new Date(s).toLocaleString('es-EC',{timeZone:'America/Guayaquil',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
const dayKey=d=>new Date(d).toLocaleDateString('es-EC',{timeZone:'America/Guayaquil'});

function td(tr,txt,cls,pill){const c=document.createElement('td');if(cls)c.className=cls;if(pill){const s=document.createElement('span');s.className='pill'+(pill==='c'?' c':'');s.textContent=txt;c.append(s);}else c.textContent=txt;tr.append(c);}
function empty(tb,cols,msg){const tr=document.createElement('tr');tr.className='empty';const c=document.createElement('td');c.colSpan=cols;c.textContent=msg;tr.append(c);tb.append(tr);}

function renderV(){
 const c=votes.filter(v=>v.choice==='cerrar').length,s=votes.filter(v=>v.choice==='seguir').length,t=c+s;
 const pc=t?Math.round(c*100/t):0,ps=t?100-pc:0;
 $('kT').textContent=t;$('kC').textContent=c;$('kS').textContent=s;
 $('pC').textContent=pc+'%';$('pS').textContent=ps+'%';$('bC').style.width=pc+'%';$('bS').style.width=ps+'%';
 const q=$('qV').value.trim().toLowerCase();const tb=$('bodyV');tb.textContent='';
 const rows=votes.filter(v=>!q||(v.name||'').toLowerCase().includes(q));
 rows.forEach((v,i)=>{const tr=document.createElement('tr');td(tr,String(rows.length-i),'n');td(tr,fmt(v.created_at));td(tr,v.name||'');td(tr,v.choice==='cerrar'?'CERRAR':'SEGUIR',null,v.choice==='cerrar'?'c':'s');tb.append(tr);});
 if(!rows.length)empty(tb,4,q?'Nada coincide con la búsqueda.':'Todavía no hay votos.');
}
function renderD(){
 $('kD').textContent=donas.length;const today=dayKey(Date.now());$('kH').textContent=donas.filter(d=>dayKey(d.created_at)===today).length;
 const q=$('qD').value.trim().toLowerCase();const tb=$('bodyD');tb.textContent='';
 const rows=donas.filter(d=>!q||[d.nombre,d.telefono,d.mail].join(' ').toLowerCase().includes(q));
 rows.forEach((d,i)=>{const tr=document.createElement('tr');td(tr,String(rows.length-i),'n');td(tr,fmt(d.created_at));td(tr,d.nombre||'');td(tr,d.telefono||'');td(tr,d.mail||'');tb.append(tr);});
 if(!rows.length)empty(tb,5,q?'Nada coincide con la búsqueda.':'Todavía no hay registros.');
}
async function fetchAll(table,cols){
 const out=[];const step=1000;
 for(let from=0;from<200000;from+=step){
  const {data,error}=await sb.from(table).select(cols).order('created_at',{ascending:false}).order('id',{ascending:true}).range(from,from+step-1);
  if(error)return {error};
  out.push(...data);if(data.length<step)break;
 }
 return {data:out};
}
async function load(){
 const [a,b]=await Promise.all([fetchAll('votes','id,name,choice,created_at'),fetchAll('donas','id,nombre,telefono,mail,created_at')]);
 if(a.error||b.error){$('upd').textContent='No se pudieron cargar los datos. Revisa que hayas corrido el SQL del panel.';return;}
 votes=a.data||[];donas=b.data||[];renderV();renderD();
 $('upd').textContent='Actualizado: '+new Date().toLocaleTimeString('es-EC',{timeZone:'America/Guayaquil',hour12:false});
}
function csv(name,head,rows){
 const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const text='﻿'+[head.map(esc).join(','),...rows.map(r=>r.map(esc).join(','))].join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.append(a);a.click();a.remove();
}
$('xV').onclick=()=>csv('ccbye-votos.csv',['Fecha','Nombre','Voto'],votes.map(v=>[fmt(v.created_at),v.name,v.choice]));
$('xD').onclick=()=>csv('ccbye-donitas.csv',['Fecha','Nombre','Telefono','Mail'],donas.map(d=>[fmt(d.created_at),d.nombre,d.telefono,d.mail]));
$('qV').oninput=renderV;$('qD').oninput=renderD;
const tab=k=>{$('pV').hidden=k!=='V';$('pD').hidden=k!=='D';$('tV').setAttribute('aria-pressed',k==='V');$('tD').setAttribute('aria-pressed',k==='D');};
$('tV').onclick=()=>tab('V');$('tD').onclick=()=>tab('D');

function show(on){$('vLogin').hidden=on;$('vPanel').hidden=!on;clearInterval(timer);if(on){load();timer=setInterval(load,15000);}}
$('fLogin').onsubmit=async e=>{e.preventDefault();$('lErr').textContent='Entrando...';
 const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
 if(error){$('lErr').textContent='Mail o contraseña incorrectos.';return;}
 $('lErr').textContent='';$('pw').value='';show(true);};
$('out').onclick=async()=>{await sb.auth.signOut();show(false);};
sb.auth.getSession().then(({data})=>show(!!data.session));
</script>
